<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep Internetowy - Menu Użytkownika</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>
        <nav class="header-icons" aria-label="Główne menu">
            <button id="search-btn" aria-label="Szukaj"><i class="fas fa-search"></i></button>
            <button id="cart-btn" aria-label="Koszyk"><i class="fas fa-shopping-cart"></i></button>

            <div class="user-menu">
                <button id="user-btn" aria-label="Menu użytkownika">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-menu-content" aria-label="Opcje użytkownika">
                    <a id="login-btn" href="#" aria-haspopup="dialog"><i class="fas fa-sign-in-alt"></i> Logowanie</a>
                    <a id="register-btn" href="#" aria-haspopup="dialog"><i class="fas fa-user-plus"></i>
                        Rejestracja</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <nav class="tabs-nav">
            <button id="home-tab" class="tab-button active">Strona Główna</button>
            <button id="reset-password-tab" class="tab-button">Przypomnij Hasło</button>
            <button id="terms-tab" class="tab-button">Regulamin</button>
        </nav>

        <div id="home" class="tab-content active">
            <h1>Witamy w naszym sklepie!</h1>
            <p>Nawiguj kursorem na ikonę użytkownika, aby otworzyć menu.</p>
        </div>

        <div id="reset-password" class="tab-content"></div>
        <div id="terms" class="tab-content"></div>

    </main>

    <div class="modal" id="login-modal">
        <div class="modal-content">
            <span class="close" id="close-login">&times;</span>
            <h2>Logowanie</h2>
            <form action="#">
                <label for="login-email">E-mail:</label>
                <input type="email" id="login-email" required>

                <label for="login-password">Hasło:</label>
                <input type="password" id="login-password" required>

                <button type="submit">Zaloguj się</button>
            </form>
        </div>
    </div>

    <div class="modal" id="register-modal">
        <div class="modal-content">
            <span class="close" id="close-register">&times;</span>
            <h2>Rejestracja</h2>
            <form action="#">
                <label for="reg-email">E-mail:</label>
                <input type="email" id="reg-email" required>

                <label for="reg-password">Hasło:</label>
                <input type="password" id="reg-password" required>

                <label for="reg-repeat-password">Powtórz hasło:</label>
                <input type="password" id="reg-repeat-password" required>

                <button type="submit">Zarejestruj się</button>
            </form>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>

</html>
